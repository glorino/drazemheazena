<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="50%" style="stop-color:#f0d078"/>
      <stop offset="100%" style="stop-color:#c49a38"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#0f2440"/>
    </linearGradient>
    <path id="textCircle" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0" fill="none"/>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Inner decorative ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Cross integrated into the D -->
  <g transform="translate(100,88)">
    <!-- Vertical cross bar -->
    <rect x="-1.5" y="-30" width="3" height="36" rx="1.5" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Horizontal cross bar -->
    <rect x="-8" y="-24" width="16" height="2.5" rx="1.25" fill="url(#goldGrad)" opacity="0.9"/>
  </g>
  
  <!-- D letter -->
  <text x="68" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" letter-spacing="-2">D</text>
  
  <!-- A letter -->
  <text x="100" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="bold" fill="url(#goldGrad)" letter-spacing="-2">A</text>
  
  <!-- Text along top arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="url(#goldGrad)" letter-spacing="3.5" font-weight="600">
    <textPath href="#textCircle" startOffset="18%">DR. AZEMHE AZENA</textPath>
  </text>
  
  <!-- Text along bottom arc -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="8" fill="url(#goldGrad)" letter-spacing="2.5" font-weight="500">
    <textPath href="#textCircle" startOffset="56%">FAITH · LEADERSHIP · IMPACT</textPath>
  </text>
  
  <!-- Small decorative dots -->
  <circle cx="28" cy="100" r="2" fill="url(#goldGrad)" opacity="0.8"/>
  <circle cx="172" cy="100" r="2" fill="url(#goldGrad)" opacity="0.8"/>
</svg>